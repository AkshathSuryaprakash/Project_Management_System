<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding for proper text rendering -->
    <meta charset="UTF-8" />

    <!-- Favicon - the small icon shown in browser tab -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Google Fonts - preconnect for faster font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DM Sans font - the main font used in this app -->
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />

    <!-- Responsive viewport - ensures proper scaling on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page title shown in browser tab -->
    <title>Project Management Platform</title>
  </head>
  <body>
    <!-- Root div - React mounts the entire app here -->
    <div id="root"></div>

    <!-- Entry point - Vite loads main.tsx which starts the React app -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
