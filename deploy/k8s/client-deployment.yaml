apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: pm-saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: pm-saas-client:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80